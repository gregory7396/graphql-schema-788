[project]
name = "csv-schema-inferer"
version = "0.1.0"
description = "Analyzes a CSV file and infers column data types (int, float, date, bool, string) by sampling rows."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
